name: Update VMaNGOS DB

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/update-db.yml"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: vmangos-db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            curl \
            unzip \
            mariadb-server \
            mariadb-client \
            libmariadb-dev \
            libmariadb-dev-compat \
            lua5.3 \
            liblua5.3-dev \
            luarocks
          sudo service mariadb start
          sudo luarocks --lua-version=5.3 install luasql-mysql MYSQL_INCDIR=/usr/include/mariadb
          lua5.3 -e 'require("luasql.mysql")'

      - name: Regenerate database
        run: bash tools/update_db.sh

      - name: Lua syntax smoke test
        run: |
          lua5.3 -e 'assert(loadfile("loader.lua"))'
          lua5.3 -e 'assert(loadfile("source.lua"))'

      - name: Commit changed database
        shell: bash
        run: |
          if git diff --quiet -- db source.lua; then
            echo "No database changes."
            exit 0
          fi

          VERSION="$(python3 tools/bump_dev_version.py pfQuest_vMangosDB.toc)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db source.lua pfQuest_vMangosDB.toc
          git commit -m "db: refresh VMaNGOS data (${VERSION})"
          git push origin HEAD:dev
